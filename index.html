<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>概算見積りシミュレーター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>概算見積り</h1>
        <p id="update-date" class="date-info">データ読み込み中...</p>
    </header>

    <main>
        <div id="item-list" class="item-container">
            </div>

        <div class="result-area">
            
            <div class="result-section">
                <div class="result-title">■ 初期費用</div>
                <div class="price-row">
                    <span>税別</span>
                    <span id="initial-price-ex" class="price-sub">0 円</span>
                </div>
                <div class="price-row total-highlight">
                    <span>税込合計</span>
                    <span id="initial-price-in" class="price-main">0 円</span>
                </div>
            </div>

            <hr class="divider">

            <div class="result-section">
                <div class="result-title">■ 月額費用</div>
                <div class="price-row">
                    <span>税別</span>
                    <span id="monthly-price-ex" class="price-sub">0 円</span>
                </div>
                <div class="price-row total-highlight">
                    <span>税込合計</span>
                    <span id="monthly-price-in" class="price-main">0 円</span>
                </div>
            </div>

            <div id="screenshot-msg" class="screenshot-msg" style="display: none;">
                <p>💡 概算が表示されています。<br>この画面を<strong>スクリーンショット</strong>して保存してください。</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
