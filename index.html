<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>概算見積りシミュレーター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>概算見積り</h1>
        <p id="update-date" class="date-info">データ読み込み中...</p>
    </header>

    <main>
        <div id="item-list" class="item-container">
            </div>

        <div class="result-area">
            <div class="total-row">
                <span>概算合計</span>
                <span id="total-price" class="price">0 円</span>
            </div>
            <p class="tax-note">※税込表示（または税抜などルールに合わせて記述）</p>
            
            <div id="screenshot-msg" class="screenshot-msg" style="display: none;">
                <p>💡 計算結果が表示されています。<br>必要であればこの画面を<strong>スクリーンショット</strong>して保存してください。</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
